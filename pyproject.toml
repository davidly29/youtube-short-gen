[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opengen-mcp"
version = "0.1.0"
description = "Local, self-hosted short-form video MCP server (personal learning clone of Everygen-style tools)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.12,<2",
    "pillow>=10",
    "httpx>=0.27",
    "edge-tts>=7",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
opengen-mcp = "opengen.server:main"

[tool.setuptools]
packages = ["opengen"]

[tool.setuptools.package-data]
opengen = ["workflows/*.md"]
