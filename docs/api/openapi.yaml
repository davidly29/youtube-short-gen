                $ref: "#/components/schemas/ApiError"
  /webhooks/{webhook_id}/deliveries:
    get:
      operationId: listDeliveries
      tags:
        - Webhooks
      summary: Recent deliveries for a webhook (newest first, up to 50)
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recent deliveries for a webhook (newest first, up to 50)
          headers:
            X-RateLimit-Limit:
              description: Requests allowed per minute for this key.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Unix time (seconds) the window resets.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryList"
        "400":
          description: The request was invalid; `error.message` says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or revoked API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such resource for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit hit. Retry after `Retry-After` seconds.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /openapi.json:
    get:
      operationId: getOpenApi
      tags:
        - Meta
      summary: This OpenAPI document
      security: []
      responses:
        "200":
          description: This OpenAPI document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenApiDocument"
        "404":
          description: No such resource for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
webhooks:
  job.succeeded:
    post:
      summary: Sent when a Short finishes rendering
      parameters:
        - name: ShortLoop-Signature
          in: header
          required: true
          schema:
            type: string
          description: t=<unix seconds>,v1=<hex HMAC-SHA256>
        - name: ShortLoop-Event
          in: header
          required: true
          schema:
            type: string
        - name: ShortLoop-Delivery
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Any 2xx acknowledges the delivery.
  job.failed:
    post:
      summary: Sent when a production or publish fails for good
      parameters:
        - name: ShortLoop-Signature
          in: header
          required: true
          schema:
            type: string
          description: t=<unix seconds>,v1=<hex HMAC-SHA256>
        - name: ShortLoop-Event
          in: header
          required: true
          schema:
            type: string
        - name: ShortLoop-Delivery
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Any 2xx acknowledges the delivery.
  publish.completed:
    post:
      summary: Sent when a Short is published or scheduled
      parameters:
        - name: ShortLoop-Signature
          in: header
          required: true
          schema:
            type: string
          description: t=<unix seconds>,v1=<hex HMAC-SHA256>
        - name: ShortLoop-Event
          in: header
          required: true
          schema:
            type: string
        - name: ShortLoop-Delivery
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Any 2xx acknowledges the delivery.
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A ShortLoop API key (sl_...).
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - not_found
                - invalid_request
                - rate_limited
                - method_not_allowed
                - internal
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    WebhookPayload:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - job.succeeded
            - job.failed
            - publish.completed
        created_at:
          type: string
        data:
          type: object
          properties:
            job_id:
              type: string
            kind:
              type: string
              enum:
                - production
                - publish
            project_id:
              type: string
            status:
              type: string
            error:
              type: string
            publish_id:
              type: string
            platform:
              type: string
            url:
              type: string
          required:
            - job_id
            - kind
            - status
          additionalProperties: false
      required:
        - id
        - type
        - created_at
        - data
      additionalProperties: false
    CreateShortOutput:
      type: object
      properties:
        project_id:
          type: string
        job_id:
          type: string
        status:
          type: string
        next:
          type: string
      required:
        - project_id
        - job_id
        - status
        - next
      additionalProperties: false
    CreateShortInputBody:
      type: object
      properties:
        topic:
          type: string
          minLength: 3
          maxLength: 300
          description: What the Short is about, e.g. 'why octopuses have three hearts'.
        angle:
          description: Optional take or framing.
          type: string
          maxLength: 300
        length_seconds:
          default: 45
          anyOf:
            - type: number
              const: 30
            - type: number
              const: 45
            - type: number
              const: 60
        tone:
          default: curious
          type: string
          minLength: 2
          maxLength: 40
        voice_id:
          description: From list_voices. Defaults to the first available voice.
          type: string
        caption_style:
          default: bold-pop
          description: From list_caption_styles.
          type: string
          enum:
            - bold-pop
            - clean-subtitle
            - highlight-word
            - karaoke
            - boxed
            - minimal
        image_style:
          default: cinematic
          description: "Look for AI images: photoreal, cinematic, 3d, hand-drawn, whiteboard, storyboard, anime."
          type: string
          maxLength: 40
        script:
          description: Your own script. Omit to have ShortLoop write one with the user's AI key (needs a key in Settings → API keys).
          type: object
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 100
            beats:
              minItems: 2
              maxItems: 12
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    minLength: 1
                    maxLength: 400
                    description: What the narrator says in this beat. Beat 1 is the hook.
                  visual:
                    type: string
                    minLength: 1
                    maxLength: 200
                    description: What to show while it's said (used to find or generate a visual).
                required:
                  - text
                  - visual
            cta:
              default: Follow for more.
              type: string
              maxLength: 200
          required:
            - title
            - beats
      required:
        - topic
    ApproveOutput:
      type: object
      properties:
        project_id:
          type: string
        approved:
          type: boolean
          const: true
      required:
        - project_id
        - approved
      additionalProperties: false
    JobView:
      type: object
      properties:
        job_id:
          type: string
        kind:
          type: string
          enum:
            - production
            - publish
        project_id:
          type: string
        status:
          type: string
          description: "production: scripting, producing, ready, approved, failed. publish: queued, uploading, published, scheduled, scheduled_next_window, failed."
        stage:
          description: script, voice, visuals or render while producing
          type: string
        progress:
          type: number
          minimum: 0
          maximum: 1
        done:
          type: boolean
          description: true when nothing more will happen without another tool call
        error:
          type: string
        video_url:
          description: Signed link to the rendered MP4 (expires in an hour).
          type: string
        publishable:
          type: boolean
        problems:
          type: array
          items:
            type: string
        url:
          description: The YouTube URL once published or scheduled.
          type: string
        retry_at:
          type: string
      required:
        - job_id
        - kind
        - status
        - progress
        - done
      additionalProperties: false
    SwapVisualInputBody:
      type: object
      properties:
        shot:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: 1-based shot number
        prompt:
          description: Describe the new image; defaults to the beat's visual.
          type: string
          maxLength: 300
      required:
        - shot
    PublishOutput:
      type: object
      properties:
        publish_id:
          type: string
        job_id:
          type: string
        status:
          type: string
        next:
          type: string
      required:
        - publish_id
        - job_id
        - status
        - next
      additionalProperties: false
    PublishInputBody:
      type: object
      properties:
        channel_id:
          description: Defaults to the user's only connected channel.
          type: string
        title:
          description: Defaults to the script title.
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 4500
        tags:
          default: []
          maxItems: 30
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
        privacy:
          default: public
          type: string
          enum:
            - public
            - unlisted
            - private
        scheduled_at:
          description: ISO time to go live (uploads private until then).
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        ai_label:
          default: false
          description: Add YouTube's altered/synthetic label. Forced on when required.
          type: boolean
    VoiceList:
      type: object
      properties:
        voices:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              language:
                type: string
              provider:
                type: string
              commercial_use:
                type: boolean
            required:
              - id
              - label
              - language
              - provider
              - commercial_use
            additionalProperties: false
      required:
        - voices
      additionalProperties: false
    CaptionStyleList:
      type: object
      properties:
        styles:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum:
                  - bold-pop
                  - clean-subtitle
                  - highlight-word
                  - karaoke
                  - boxed
                  - minimal
              label:
                type: string
              description:
                type: string
            required:
              - id
              - label
              - description
            additionalProperties: false
      required:
        - styles
      additionalProperties: false
    EstimateOutput:
      type: object
      properties:
        shorts:
          type: number
        ai_video_credits:
          type: number
        balance:
          type: object
          properties:
            shorts:
              type: number
            ai_video_credits:
              type: number
            plan:
              type: string
          required:
            - shorts
            - ai_video_credits
          additionalProperties: false
        affordable:
          type: boolean
        note:
          type: string
      required:
        - shorts
        - ai_video_credits
        - balance
        - affordable
        - note
      additionalProperties: false
    EstimateInputBody:
      type: object
      properties:
        length_seconds:
          default: 45
          anyOf:
            - type: number
              const: 30
            - type: number
              const: 45
            - type: number
              const: 60
        ai_video_seconds:
          default: 0
          type: integer
          minimum: 0
          maximum: 60
    Balance:
      type: object
      properties:
        shorts:
          type: number
        ai_video_credits:
          type: number
        plan:
          type: string
      required:
        - shorts
        - ai_video_credits
      additionalProperties: false
    TrendsOutput:
      type: object
      properties:
        available:
          type: boolean
        message:
          type: string
        trends:
          type: array
          items:
            type: object
            properties:
              topic:
                type: string
              why_now:
                type: string
            required:
              - topic
              - why_now
            additionalProperties: false
      required:
        - available
        - message
        - trends
      additionalProperties: false
    ListWorkflowsOutput:
      type: object
      properties:
        workflows:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              title:
                type: string
              summary:
                type: string
            required:
              - slug
              - title
              - summary
            additionalProperties: false
      required:
        - workflows
      additionalProperties: false
    GetWorkflowOutput:
      type: object
      properties:
        slug:
          type: string
        phase:
          type: string
          enum:
            - start
            - script
            - visuals
            - publish
        markdown:
          type: string
          description: Step-by-step instructions for this phase.
      required:
        - slug
        - phase
        - markdown
      additionalProperties: false
    WebhookList:
      type: object
      properties:
        webhooks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              url:
                type: string
              events:
                type: array
                items:
                  type: string
                  enum:
                    - job.succeeded
                    - job.failed
                    - publish.completed
              created_at:
                type: string
            required:
              - id
              - url
              - events
              - created_at
            additionalProperties: false
      required:
        - webhooks
      additionalProperties: false
    WebhookCreated:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
            enum:
              - job.succeeded
              - job.failed
              - publish.completed
        created_at:
          type: string
        secret:
          type: string
          description: "Signing secret (whsec_...). Shown once: store it to verify ShortLoop-Signature."
      required:
        - id
        - url
        - events
        - created_at
        - secret
      additionalProperties: false
    CreateWebhookBody:
      type: object
      properties:
        url:
          type: string
          maxLength: 2000
        events:
          default:
            - job.succeeded
            - job.failed
            - publish.completed
          minItems: 1
          maxItems: 3
          type: array
          items:
            type: string
            enum:
              - job.succeeded
              - job.failed
              - publish.completed
      required:
        - url
    Deleted:
      type: object
      properties:
        id:
          type: string
        deleted:
          type: boolean
          const: true
      required:
        - id
        - deleted
      additionalProperties: false
    DeliveryList:
      type: object
      properties:
        deliveries:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              event:
                type: string
                enum:
                  - job.succeeded
                  - job.failed
                  - publish.completed
              status:
                type: string
                enum:
                  - pending
                  - delivered
                  - failed
              attempts:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              response_status:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              error:
                type: string
              created_at:
                type: string
              delivered_at:
                type: string
              next_attempt_at:
                type: string
            required:
              - id
              - event
              - status
              - attempts
              - created_at
            additionalProperties: false
      required:
        - deliveries
      additionalProperties: false
    OpenApiDocument:
      type: object
      properties:
        openapi:
          type: string
      required:
        - openapi
      additionalProperties: {}
