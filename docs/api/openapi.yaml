webhooks:
  job.succeeded:
    post:
      summary: Sent when a Short finishes rendering
      parameters:
        - name: ShortLoop-Signature
          in: header
          required: true
          schema:
            type: string
          description: t=<unix seconds>,v1=<hex HMAC-SHA256>
        - name: ShortLoop-Event
          in: header
          required: true
          schema:
            type: string
        - name: ShortLoop-Delivery
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Any 2xx acknowledges the delivery.
  job.failed:
    post:
      summary: Sent when a production or publish fails for good
      parameters:
        - name: ShortLoop-Signature
          in: header
          required: true
          schema:
            type: string
          description: t=<unix seconds>,v1=<hex HMAC-SHA256>
        - name: ShortLoop-Event
          in: header
          required: true
          schema:
            type: string
        - name: ShortLoop-Delivery
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Any 2xx acknowledges the delivery.
  publish.completed:
    post:
      summary: Sent when a Short is published or scheduled
      parameters:
        - name: ShortLoop-Signature
          in: header
          required: true
          schema:
            type: string
          description: t=<unix seconds>,v1=<hex HMAC-SHA256>
        - name: ShortLoop-Event
          in: header
          required: true
          schema:
            type: string
        - name: ShortLoop-Delivery
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Any 2xx acknowledges the delivery.
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A ShortLoop API key (sl_...).
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - not_found
                - invalid_request
                - rate_limited
                - method_not_allowed
                - internal
            message:
              type: string
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    WebhookPayload:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - job.succeeded
            - job.failed
            - publish.completed
        created_at:
          type: string
        data:
          type: object
          properties:
            job_id:
              type: string
            kind:
              type: string
              enum:
                - production
                - publish
            project_id:
              type: string
            status:
              type: string
            error:
              type: string
            publish_id:
              type: string
            platform:
              type: string
            url:
              type: string
          required:
            - job_id
            - kind
            - status
          additionalProperties: false
      required:
        - id
        - type
        - created_at
        - data
      additionalProperties: false
    CreateShortOutput:
      type: object
      properties:
        project_id:
          type: string
        job_id:
          type: string
        status:
          type: string
        next:
          type: string
        app_url:
          description: Where the user can watch, edit and approve it in ShortLoop.
          type: string
        job:
          description: The job's state after waiting, when wait_seconds > 0.
          type: object
          properties:
            job_id:
              type: string
            kind:
              type: string
              enum:
                - production
                - publish
            project_id:
              type: string
            status:
              type: string
              description: "production: scripting, producing, ready, approved, failed. publish: queued, uploading, published, scheduled, scheduled_next_window, failed."
            stage:
              description: script, voice, visuals or render while producing
              type: string
            progress:
              type: number
              minimum: 0
              maximum: 1
            done:
              type: boolean
              description: true when nothing more will happen without another tool call
            error:
              type: string
            video_url:
              description: Signed link to the rendered MP4 (expires in an hour).
              type: string
            publishable:
              type: boolean
            problems:
              type: array
              items:
                type: string
            url:
              description: The YouTube URL once published or scheduled.
              type: string
            retry_at:
              type: string
          required:
            - job_id
            - kind
            - status
            - progress
            - done
          additionalProperties: false
      required:
        - project_id
        - job_id
        - status
        - next
      additionalProperties: false
    CreateShortInputBody:
      type: object
      properties:
        topic:
          type: string
          minLength: 3
          maxLength: 300
          description: What the Short is about, e.g. 'why octopuses have three hearts'.
        angle:
          description: Optional take or framing.
          type: string
          maxLength: 300
        length_seconds:
          default: 45
          anyOf:
            - type: number
              const: 30
            - type: number
              const: 45
            - type: number
              const: 60
        tone:
          default: curious
          type: string
          minLength: 2
          maxLength: 40
        voice_id:
          description: From list_voices. Defaults to the first available voice.
          type: string
        caption_style:
          default: bold-pop
          description: From list_caption_styles.
          type: string
          enum:
            - bold-pop
            - clean-subtitle
            - highlight-word
            - karaoke
            - boxed
            - minimal
        image_style:
          default: cinematic
          description: "Look for AI images: photoreal, cinematic, 3d, hand-drawn, whiteboard, storyboard, anime."
          type: string
          maxLength: 40
        script:
          description: Your own script. Omit to have ShortLoop write one with the user's AI key (needs a key in Settings → API keys).
          type: object
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 100
            beats:
              minItems: 2
              maxItems: 12
              type: array
              items:
                type: object
                properties:
                  text:
                    type: string
                    minLength: 1
                    maxLength: 400
                    description: What the narrator says in this beat. Beat 1 is the hook.
                  visual:
                    type: string
                    minLength: 1
                    maxLength: 200
                    description: What to show while it's said (used to find or generate a visual).
                required:
                  - text
                  - visual
            cta:
              default: Follow for more.
              type: string
              maxLength: 200
          required:
            - title
            - beats
        topic_id:
          description: The topic_id of a get_trends idea this Short is made from (keeps it out of later briefs).
          type: string
          pattern: ^top_[A-Za-z0-9_]{1,60}$
        channel_voice_id:
          description: A channel id from list_channels whose learned voice the script should follow.
          type: string
          maxLength: 80
        library_asset_ids:
          description: The user's own uploads (from list_library) to use on the beats they match, before stock or AI.
          maxItems: 30
          type: array
          items:
            type: string
            maxLength: 100
        wait_seconds:
          default: 0
          description: Wait up to this long for the Short to finish before returning (like wait_for_job).
          type: integer
          minimum: 0
          maximum: 50
      required:
        - topic
    ListShortsOutput:
      type: object
      properties:
        shorts:
          type: array
          items:
            type: object
            properties:
              project_id:
                type: string
              title:
                type: string
              status:
                type: string
              created_at:
                type: string
              published_urls:
                type: array
                items:
                  type: string
              app_url:
                type: string
                description: Link to this in the ShortLoop app.
            required:
              - project_id
              - title
              - status
              - created_at
              - published_urls
              - app_url
            additionalProperties: false
      required:
        - shorts
      additionalProperties: false
    ShortDetail:
      type: object
      properties:
